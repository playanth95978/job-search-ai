# Temporary HTTP-only config used ONLY to obtain the first Let's Encrypt cert.
# Domain is set to aicarreerfinder.com. Mount it as default.conf, issue the cert,
# then switch to job-search-ai.conf (see deploy/README.md).

server {
    listen 80;
    server_name aicarreerfinder.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'job-search-ai: awaiting TLS certificate issuance';
        add_header Content-Type text/plain;
    }
}
