# Reverse proxy for job-search-ai.
# Domain is set to aicarreerfinder.com. To reuse this template for another domain,
# replace every occurrence of aicarreerfinder.com below.

# --- HTTP: ACME challenge + redirect to HTTPS ----------------------
server {
    listen 80;
    server_name aicarreerfinder.com;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: proxy to the Spring Boot app ---------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name aicarreerfinder.com;

    ssl_certificate     /etc/letsencrypt/live/aicarreerfinder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicarreerfinder.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # CV uploads are up to 50 MB (see spring.servlet.multipart).
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # LLM / AI calls can be slow — allow long-lived responses.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
