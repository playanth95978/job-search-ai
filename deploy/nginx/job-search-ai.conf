# Reverse proxy for job-search-ai.
# Domain is set to aicarreerfinder.com. To reuse this template for another domain,
# replace every occurrence of aicarreerfinder.com below.

# `Connection: upgrade` must only be sent for requests that actually ask for an upgrade.
# Sending it unconditionally (as `proxy_set_header Connection "upgrade"` does) breaks keep-alive
# for every ordinary request — including the several dozen JS chunks a cold browser downloads in
# parallel — and shows up as intermittent failed assets on a first visit.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: ACME challenge + redirect to HTTPS ----------------------
server {
    listen 80;
    server_name aicarreerfinder.com;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: proxy to the Spring Boot app ---------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name aicarreerfinder.com;

    ssl_certificate     /etc/letsencrypt/live/aicarreerfinder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicarreerfinder.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # CV uploads are up to 50 MB (see spring.servlet.multipart).
    client_max_body_size 50m;

    # Compresses the bundles: they are the bulk of a first visit.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Hashed build artefacts: the name changes on every build, so they can be cached forever.
    # Without this, every new visit re-downloads the whole bundle through the app.
    location ~* ^/(chunk|main|polyfills|styles|scripts)-[A-Z0-9]+\.(js|css)$ {
        proxy_pass http://app:8080;
        proxy_buffering on;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what points to the current chunk hashes. A stale copy
    # references files that no longer exist after a deployment — the "blank page / error page until
    # I reload" symptom.
    location = / {
        proxy_pass http://app:8080;
        proxy_buffering on;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Server-Sent Events (assistant streaming): buffering must stay off here, and only here,
    # otherwise nginx holds the tokens back until the response completes.
    location /api/job-copilot/assistant/ {
        proxy_pass http://app:8080;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        proxy_pass http://app:8080;

        # Buffering on for everything else: it frees the upstream worker as soon as the response is
        # read, which matters when a cold browser opens dozens of connections at once.
        proxy_buffering on;

        # LLM / AI calls can be slow — allow long-lived responses.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
