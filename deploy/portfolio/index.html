<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthony Attia — Senior Full-Stack & AI Engineer</title>
</head>
<body>
<style>
  :root {
    --bg: #eaedf1;
    --surface: #f5f7fa;
    --surface-2: #ffffff;
    --ink: #14181f;
    --muted: #55606d;
    --faint: #8b95a2;
    --line: #d2d8e0;
    --accent: #9a5a00;
    --accent-line: #c67e12;
    --glow: rgba(198, 126, 18, 0.22);

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;

    --fs-hero: clamp(2.6rem, 7.2vw, 5.1rem);
    --fs-h2: clamp(1.45rem, 3.4vw, 2.15rem);
    --fs-h3: 1.16rem;
    --fs-body: 1.0625rem;
    --fs-mono: 0.78rem;

    --maxw: 1080px;
    --gutter: clamp(1.15rem, 4vw, 3rem);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e14;
      --surface: #111823;
      --surface-2: #16202c;
      --ink: #e9edf3;
      --muted: #93a0b1;
      --faint: #616d7c;
      --line: #212b38;
      --accent: #e8b44a;
      --accent-line: #e8b44a;
      --glow: rgba(232, 180, 74, 0.26);
    }
  }

  :root[data-theme="light"] {
    --bg: #eaedf1;
    --surface: #f5f7fa;
    --surface-2: #ffffff;
    --ink: #14181f;
    --muted: #55606d;
    --faint: #8b95a2;
    --line: #d2d8e0;
    --accent: #9a5a00;
    --accent-line: #c67e12;
    --glow: rgba(198, 126, 18, 0.22);
  }

  :root[data-theme="dark"] {
    --bg: #0a0e14;
    --surface: #111823;
    --surface-2: #16202c;
    --ink: #e9edf3;
    --muted: #93a0b1;
    --faint: #616d7c;
    --line: #212b38;
    --accent: #e8b44a;
    --accent-line: #e8b44a;
    --glow: rgba(232, 180, 74, 0.26);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--fs-body);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  a { color: inherit; }

  .eyebrow {
    font-family: var(--mono);
    font-size: var(--fs-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0;
  }
  .eyebrow::before {
    content: "";
    width: 1.6rem;
    height: 1px;
    background: var(--accent-line);
  }

  /* ---------- top nav ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: saturate(1.4) blur(12px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .brand {
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-decoration: none;
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }
  .brand .tag { color: var(--accent); }
  .brand .full { color: var(--faint); font-size: 0.8rem; letter-spacing: 0.1em; }
  @media (max-width: 620px) { .brand .full { display: none; } }

  .nav {
    display: flex;
    align-items: center;
    gap: 1.6rem;
  }
  .nav a {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    position: relative;
    padding: 2px 0;
    transition: color 0.2s;
  }
  .nav a:hover, .nav a.active { color: var(--ink); }
  .nav a.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 2px;
    background: var(--accent-line);
  }
  @media (max-width: 780px) { .nav .navlink { display: none; } }

  .toggle {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    width: 34px; height: 34px;
    border-radius: 3px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .toggle:hover { color: var(--accent); border-color: var(--accent-line); }
  .toggle svg { width: 17px; height: 17px; }
  .toggle .i-sun { display: none; }
  @media (prefers-color-scheme: dark) { .toggle .i-sun { display: block; } .toggle .i-moon { display: none; } }
  :root[data-theme="dark"] .toggle .i-sun { display: block; }
  :root[data-theme="dark"] .toggle .i-moon { display: none; }
  :root[data-theme="light"] .toggle .i-sun { display: none; }
  :root[data-theme="light"] .toggle .i-moon { display: block; }

  /* ---------- hero ---------- */
  .hero { padding: clamp(3rem, 9vw, 6.5rem) 0 clamp(2.5rem, 6vw, 4rem); }
  .hero-grid { display: grid; gap: 1.4rem; }
  .signal-strip { width: 100%; height: 46px; display: block; opacity: 0.9; }
  .hero h1 {
    font-size: var(--fs-hero);
    line-height: 0.98;
    letter-spacing: -0.03em;
    font-weight: 800;
    margin: 0.2rem 0 0;
    text-wrap: balance;
  }
  .hero .role {
    font-size: clamp(1.05rem, 2.4vw, 1.4rem);
    font-weight: 500;
    color: var(--muted);
    margin: 0;
  }
  .stream {
    font-family: var(--mono);
    font-size: 0.86rem;
    color: var(--accent);
    min-height: 1.4em;
    letter-spacing: 0.02em;
  }
  .stream .cursor {
    display: inline-block;
    width: 0.55ch;
    background: var(--accent-line);
    color: transparent;
    margin-left: 1px;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .avail {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.4rem;
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .avail span { display: inline-flex; align-items: center; gap: 0.45rem; }
  .avail .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-line); box-shadow: 0 0 0 3px var(--glow); }

  .contacts {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin-top: 0.4rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    font-family: var(--mono);
    font-size: 0.76rem;
    letter-spacing: 0.05em;
    padding: 0.5rem 0.85rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink);
    background: var(--surface-2);
    transition: border-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover {
    border-color: var(--accent-line);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px -14px var(--glow);
  }
  .btn.primary { background: var(--accent-line); border-color: var(--accent-line); color: #14100a; }
  :root[data-theme="dark"] .btn.primary { color: #17130a; }
  .btn.primary:hover { color: #14100a; filter: brightness(1.06); }

  /* ---------- section frame ---------- */
  section { padding: clamp(2.6rem, 7vw, 4.6rem) 0; }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .sec-head .idx {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--faint);
    letter-spacing: 0.1em;
  }
  .sec-head h2 {
    font-size: var(--fs-h2);
    letter-spacing: -0.02em;
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
  }
  .divider { height: 1px; background: var(--line); border: 0; margin: 0; }

  .lede {
    max-width: 62ch;
    font-size: clamp(1.1rem, 2vw, 1.28rem);
    line-height: 1.6;
    color: var(--ink);
  }
  .lede strong { color: var(--accent); font-weight: 600; }

  /* ---------- timeline ---------- */
  .timeline { position: relative; padding-left: clamp(1.6rem, 5vw, 3rem); }
  .spine {
    position: absolute;
    left: 6px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .spine .fill {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    height: 0%;
    background: linear-gradient(var(--accent-line), color-mix(in srgb, var(--accent-line) 30%, transparent));
    box-shadow: 0 0 12px var(--glow);
  }
  .node {
    position: relative;
    padding: 0 0 2.4rem 0;
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .node.in { opacity: 1; transform: none; }
  .node:last-child { padding-bottom: 0; }
  .node::before {
    content: "";
    position: absolute;
    left: calc(-1 * clamp(1.6rem, 5vw, 3rem) + 1px);
    top: 6px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--accent-line);
    transform: translateX(-50%);
    transition: box-shadow 0.4s, background 0.4s;
  }
  .node.in::before { background: var(--accent-line); box-shadow: 0 0 0 5px var(--glow); }

  .node .year {
    font-family: var(--mono);
    font-size: 0.76rem;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .node h3 {
    font-size: var(--fs-h3);
    margin: 0.25rem 0 0.1rem;
    letter-spacing: -0.01em;
    font-weight: 650;
  }
  .node .org {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 0.75rem;
  }
  .node ul {
    margin: 0 0 0.85rem;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    max-width: 64ch;
  }
  .node li {
    position: relative;
    padding-left: 1.15rem;
    color: var(--ink);
    font-size: 0.98rem;
  }
  .node li::before {
    content: "";
    position: absolute;
    left: 0; top: 0.62em;
    width: 6px; height: 1px;
    background: var(--accent-line);
  }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .tag {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    padding: 0.22rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--muted);
    background: color-mix(in srgb, var(--surface) 60%, transparent);
  }

  /* ---------- skills ---------- */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .skill-group {
    background: var(--surface);
    padding: 1.25rem 1.3rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .skill-group h3 {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .skill-group h3 .num { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    font-size: 0.84rem;
    padding: 0.28rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface-2);
    color: var(--ink);
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
  }
  .chip:hover { border-color: var(--accent-line); color: var(--accent); transform: translateY(-1px); }

  /* ---------- projects ---------- */
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.1rem; }
  .card {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  }
  .card:hover { border-color: var(--accent-line); transform: translateY(-3px); box-shadow: 0 18px 40px -28px var(--glow); }
  .card .kicker {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card h3 { font-size: 1.22rem; margin: 0; letter-spacing: -0.01em; }
  .card p { margin: 0; color: var(--muted); font-size: 0.96rem; }
  .card .live {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    text-decoration: none;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.76rem;
    margin-top: auto;
    padding-top: 0.4rem;
  }
  .card .live[href]:hover { text-decoration: underline; }
  .card .live svg { width: 14px; height: 14px; }

  /* ---------- meta (education / languages) ---------- */
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem 3rem; }
  .meta-block h3 {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--line);
  }
  .meta-item { margin-bottom: 0.85rem; }
  .meta-item .t { font-weight: 600; }
  .meta-item .s { color: var(--muted); font-size: 0.92rem; }
  .lang-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px dashed var(--line); }
  .lang-row:last-child { border-bottom: 0; }
  .lang-row .lv { font-family: var(--mono); font-size: 0.74rem; color: var(--accent); letter-spacing: 0.04em; }

  /* ---------- footer ---------- */
  footer { border-top: 1px solid var(--line); padding: 2.4rem 0 3rem; margin-top: 1.5rem; }
  .foot { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
  .foot .mono { color: var(--faint); font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.06em; }
  .foot a { color: var(--accent); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  :focus-visible { outline: 2px solid var(--accent-line); outline-offset: 3px; border-radius: 2px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .node { opacity: 1; transform: none; transition: none; }
    .stream .cursor { animation: none; }
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#top"><span class="tag">AA</span><span class="full" id="brandFull"></span></a>
    <nav class="nav" aria-label="Sections">
      <a class="navlink" href="#profile">Profile</a>
      <a class="navlink" href="#timeline">Timeline</a>
      <a class="navlink" href="#skills">Skills</a>
      <a class="navlink" href="#projects">Projects</a>
      <button class="toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <canvas class="signal-strip" id="signal" aria-hidden="true"></canvas>
      <p class="eyebrow" id="eyebrow"></p>

  <div class="wrap"><hr class="divider"></div>

  <section id="profile">
    <div class="wrap">
      <div class="sec-head"><span class="idx">01</span><h2>Profile</h2></div>
      <p class="lede" id="profileText"></p>
    </div>
  </section>

  <div class="wrap"><hr class="divider"></div>

  <section id="timeline">
    <div class="wrap">
      <div class="sec-head"><span class="idx">02</span><h2>Career signal</h2></div>
      <div class="timeline">
        <div class="spine" aria-hidden="true"><div class="fill" id="spineFill"></div></div>
        <div id="timelineNodes"></div>
      </div>
    </div>
  </section>

  <div class="wrap"><hr class="divider"></div>

  <section id="skills">
    <div class="wrap">
      <div class="sec-head"><span class="idx">03</span><h2>Capabilities</h2></div>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>
  </section>

  <div class="wrap"><hr class="divider"></div>

  <section id="projects">
    <div class="wrap">
      <div class="sec-head"><span class="idx">04</span><h2>Featured work</h2></div>
      <div class="proj-grid" id="projGrid"></div>
    </div>
  </section>

  <div class="wrap"><hr class="divider"></div>

  <section id="about">
    <div class="wrap">
      <div class="sec-head"><span class="idx">05</span><h2>Education &amp; languages</h2></div>
      <div class="meta-grid">
        <div class="meta-block"><h3>Education</h3><div id="eduBlock"></div></div>
        <div class="meta-block"><h3>Languages</h3><div id="langBlock"></div></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span class="mono" id="footLeft"></span>
    <span class="mono" id="footRight"></span>
  </div>
</footer>

        org: "Province Sud · Government",
        bullets: [

        ],
        tags: ["Full-stack", "Public sector", "Agile"]
      },
      {

        title: "Full-Stack Developer",
        org: "OPT Telecommunications · Contract · Nouméa",
        bullets: [
          "Delivered customer-management and telecom applications (Java backend, Angular front-end) for a user base approaching 200,000.",
          "Shipped cross-platform mobile apps with Ionic and improved reliability of internal enterprise systems."

        tags: ["Java / J2EE", "AngularJS", "Microservices", "Mentoring"]

    ],

    skills: [
      { label: "AI / GenAI", items: ["RAG pipelines", "Vector search (pgvector)", "Embeddings", "Cross-encoder reranking", "Spring AI", "FastAPI", "Ollama", "Mistral", "SSE streaming"] },
      { label: "Backend", items: ["Java 8–21", "Spring Boot / MVC", "JPA / Hibernate", "REST API design", "Apache Kafka", "Python / FastAPI"] },
      { label: "Frontend", items: ["Angular", "TypeScript", "PrimeNG", "HTML5 / CSS3", "React"] },
      { label: "DevOps & Data", items: ["Docker", "Kubernetes", "PostgreSQL", "Elasticsearch / Kibana", "JHipster", "Git"] },
      { label: "Architecture", items: ["Microservices", "High-volume data systems", "Agile / Scrum"] }
    ],

    projects: [
      {
        kicker: "Live product · self-built",
        title: "AI Career Finder",
        desc: "Intelligent job-search platform: semantic matching of candidates to job listings using RAG and CV / job-offer embeddings. Full ownership of the AI pipeline, backend and front-end — from design to production deployment.",
        link: { label: "aicarreerfinder.com", href: "https://aicarreerfinder.com" }

      {

        title: "Enterprise RAG Assistant",
        desc: "Hybrid retrieval over pgvector + BM25 with reciprocal-rank fusion and cross-encoder reranking (bge-reranker-v2-m3). Streaming answers over Server-Sent Events with source attribution and multi-provider LLM. Ported the full pipeline from Java / Spring AI to Python / FastAPI to prove cross-stack delivery.",

    languages: [
      { name: "French", level: "Native" },

      { name: "Spanish", level: "Intermediate" }
    ]
  };

  (function () {
    "use strict";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function $(id) { return document.getElementById(id); }

    var ICONS = {
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
      globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
      linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.4 8.65 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.3-2-3.3-2 0-2.3 1.56-2.3 3.2V21H9z"/></svg>',
      github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M9 7h8v8"/></svg>'
    };

    /* ---------- render from CV data ---------- */
    $("brandFull").textContent = CV.name.toUpperCase();
    $("eyebrow").textContent = CV.eyebrow;
    $("name").textContent = CV.name;
    $("role").textContent = CV.role;
    $("profileText").innerHTML = CV.profile;

    $("avail").innerHTML = CV.availability.map(function (a) {
      return "<span>" + (a.dot ? '<span class="dot"></span>' : "") + esc(a.text) + "</span>";
    }).join("");

    $("contacts").innerHTML = CV.contacts.map(function (c) {
      var ext = /^https?:/.test(c.href) ? ' target="_blank" rel="noopener"' : "";
      return '<a class="btn' + (c.primary ? " primary" : "") + '" href="' + esc(c.href) + '"' + ext + ">" +
        (ICONS[c.icon] || "") + esc(c.label) + "</a>";
    }).join("");

    $("timelineNodes").innerHTML = CV.experiences.map(function (e) {
      var bullets = e.bullets.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("");
      var tags = (e.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
      return '<article class="node">' +
        '<div class="year">' + esc(e.year) + "</div>" +
        "<h3>" + esc(e.title) + "</h3>" +
        '<p class="org">' + esc(e.org) + "</p>" +
        "<ul>" + bullets + "</ul>" +
        '<div class="tags">' + tags + "</div>" +
        "</article>";
    }).join("");

    $("skillsGrid").innerHTML = CV.skills.map(function (g, i) {
      var num = "/" + String(i + 1).padStart(2, "0");
      var chips = g.items.map(function (s) { return '<span class="chip">' + esc(s) + "</span>"; }).join("");
      return '<div class="skill-group"><h3><span class="num">' + num + "</span> " + esc(g.label) + "</h3>" +
        '<div class="chips">' + chips + "</div></div>";
    }).join("");

    $("projGrid").innerHTML = CV.projects.map(function (p) {
      var foot = p.link
        ? '<a class="live" href="' + esc(p.link.href) + '" target="_blank" rel="noopener">' + esc(p.link.label) + ICONS.external + "</a>"
        : (p.note ? '<span class="live" style="color:var(--muted)">' + esc(p.note) + "</span>" : "");
      return '<article class="card"><div class="kicker"><span>' + esc(p.kicker) + "</span><span>◆</span></div>" +
        "<h3>" + esc(p.title) + "</h3><p>" + esc(p.desc) + "</p>" + foot + "</article>";
    }).join("");

    $("eduBlock").innerHTML = CV.education.map(function (e) {
      return '<div class="meta-item"><div class="t">' + esc(e.title) + '</div><div class="s">' + esc(e.school) + "</div></div>";
    }).join("");

    $("langBlock").innerHTML = CV.languages.map(function (l) {
      return '<div class="lang-row"><span>' + esc(l.name) + '</span><span class="lv">' + esc(l.level) + "</span></div>";
    }).join("");

    $("footLeft").textContent = "© 2026 " + CV.name + " — " + CV.location;
    $("footRight").innerHTML = '<a href="mailto:' + esc(CV.email) + '">' + esc(CV.email) + "</a>";

    /* ---------- theme toggle ---------- */
    var root = document.documentElement;
    function current() {
      var set = root.getAttribute("data-theme");
      if (set) return set;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    $("themeToggle").addEventListener("click", function () {
      root.setAttribute("data-theme", current() === "dark" ? "light" : "dark");
    });

    /* ---------- streaming caption ---------- */
    var stream = $("stream");
    var phrases = CV.streamPhrases;
    if (reduce) {
      stream.textContent = phrases[phrases.length - 1];
    } else {
      var pi = 0, ci = 0;
      var txt = document.createTextNode("");
      var cur = document.createElement("span");
      cur.className = "cursor"; cur.textContent = ".";
      stream.appendChild(txt); stream.appendChild(cur);
      function tick() {
        var p = phrases[pi];
        if (ci <= p.length) { txt.nodeValue = p.slice(0, ci); ci++; setTimeout(tick, 34); }
        else { setTimeout(erase, 2100); }
      }
      function erase() {
        var p = phrases[pi];
        if (ci >= 0) { txt.nodeValue = p.slice(0, ci); ci--; setTimeout(erase, 12); }
        else { ci = 0; pi = (pi + 1) % phrases.length; setTimeout(tick, 260); }
      }
      setTimeout(tick, 650);
    }

    /* ---------- timeline reveal + spine fill ---------- */
    var nodes = Array.prototype.slice.call(document.querySelectorAll(".node"));
    if (reduce || !("IntersectionObserver" in window)) {
      nodes.forEach(function (n) { n.classList.add("in"); });
    } else {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.35, rootMargin: "0px 0px -8% 0px" });
      nodes.forEach(function (n) { io.observe(n); });
    }

    var fill = $("spineFill");
    var tl = $("timeline");
    function onScroll() {
      if (!fill || !tl) return;
      var r = tl.getBoundingClientRect();
      var vh = window.innerHeight;
      var total = r.height + vh * 0.4;
      var progressed = Math.min(Math.max(vh * 0.6 - r.top, 0), total);
      fill.style.height = (progressed / total * 100).toFixed(2) + "%";
    }
    if (!reduce) {
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      onScroll();
    } else if (fill) {
      fill.style.height = "100%";
    }

    /* ---------- nav active section ---------- */
    var links = Array.prototype.slice.call(document.querySelectorAll(".nav a.navlink"));
    if ("IntersectionObserver" in window) {
      var navio = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            var id = "#" + e.target.id;
            links.forEach(function (l) { l.classList.toggle("active", l.getAttribute("href") === id); });
          }
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      links.forEach(function (l) {
        var s = document.querySelector(l.getAttribute("href"));
        if (s) navio.observe(s);
      });
    }

    /* ---------- hero signal waveform ---------- */
    var cv = $("signal");
    if (cv && !reduce) {
      var ctx = cv.getContext("2d");
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = 0, h = 0;
      function size() {
        w = cv.clientWidth; h = cv.clientHeight;
        cv.width = w * dpr; cv.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      size();
      window.addEventListener("resize", size);
      var t = 0;
      function accent() { return getComputedStyle(root).getPropertyValue("--accent-line").trim() || "#c67e12"; }
      function frame() {
        ctx.clearRect(0, 0, w, h);
        var col = accent(), mid = h / 2;
        ctx.lineWidth = 1.6; ctx.strokeStyle = col; ctx.globalAlpha = 0.85;
        ctx.beginPath();
        for (var x = 0; x <= w; x += 2) {
          var k = x / w;
          var env = Math.exp(-Math.pow((k - 0.5) * 5.5, 2)) * 0.9 + 0.06;
          var y = mid + Math.sin(x * 0.06 + t) * 13 * env + Math.sin(x * 0.017 - t * 0.6) * 6 * env;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
        var hx = (t * 46 % (w + 120)) - 60;
        var henv = Math.exp(-Math.pow((hx / w - 0.5) * 5.5, 2)) * 0.9 + 0.06;
        var hy = mid + Math.sin(hx * 0.06 + t) * 13 * henv + Math.sin(hx * 0.017 - t * 0.6) * 6 * henv;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(hx, hy, 2.6, 0, Math.PI * 2); ctx.fill();
        t += 0.03;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    } else if (cv) {
      cv.style.display = "none";
    }
  })();
</script>
