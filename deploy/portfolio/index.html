<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthony Attia — Senior Full-Stack & AI Engineer</title>

<body>
<style>
  :root {
    --bg: #020617;
    --surface: rgba(15, 23, 42, 0.7);
    --surface-2: rgba(30, 41, 59, 0.5);
    --ink: #f8fafc;
    --muted: #94a3b8;
    --faint: #475569;
    --line: rgba(255, 255, 255, 0.1);
    --accent: #22d3ee;
    --accent-2: #818cf8;
    --accent-line: #06b6d4;
    --glow: rgba(34, 211, 238, 0.3);
    --glow-2: rgba(129, 140, 248, 0.2);

    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;

    --fs-hero: clamp(2.8rem, 8vw, 5.5rem);
    --fs-h2: clamp(1.6rem, 4vw, 2.5rem);
    --fs-h3: 1.25rem;
    --fs-body: 1.0625rem;
    --fs-mono: 0.82rem;

    --maxw: 1100px;
    --gutter: clamp(1.25rem, 5vw, 3.5rem);

    --glass: blur(12px) saturate(180%);
  }

  :root[data-theme="light"] {
    --bg: #f8fafc;
    --surface: rgba(255, 255, 255, 0.8);
    --surface-2: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --line: rgba(0, 0, 0, 0.1);
    --accent: #0891b2;
    --accent-2: #4f46e5;
    --accent-line: #0891b2;
    --glow: rgba(8, 145, 178, 0.15);
    --glow-2: rgba(79, 70, 229, 0.1);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--fs-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      radial-gradient(circle at 2px 2px, var(--line) 1px, transparent 0);
    background-size: 40px 40px;
    z-index: -1;
    mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
    pointer-events: none;
  }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  a { color: inherit; transition: color 0.2s; }

  .eyebrow {
    font-family: var(--mono);
    font-size: var(--fs-mono);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.5rem;
    font-weight: 700;
  }
  .eyebrow::after {
    content: "";
    width: 2rem;
    height: 1px;
    background: var(--accent-line);
    opacity: 0.5;
  }

  /* ---------- top nav ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: var(--glass);
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
  }
  .brand {
    font-family: var(--mono);
    font-weight: 800;
    letter-spacing: 0.1em;
    text-decoration: none;
    font-size: 1.2rem;
  }
  .brand .tag {
    color: var(--bg);
    background: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 8px;
  }
  .brand .full { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
  @media (max-width: 620px) { .brand .full { display: none; } }

  .nav {
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  .nav a {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
    position: relative;
    padding: 4px 0;
  }
  .nav a:hover, .nav a.active { color: var(--accent); }
  .nav a.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 10px var(--glow);
  }
  @media (max-width: 780px) { .nav .navlink { display: none; } }

  .toggle {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    width: 38px; height: 38px;
    border-radius: 8px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--surface); transform: scale(1.05); }
  .toggle svg { width: 18px; height: 18px; }
  .toggle .i-sun { display: none; }
  :root[data-theme="dark"] .toggle .i-sun { display: block; }
  :root[data-theme="dark"] .toggle .i-moon { display: none; }
  :root[data-theme="light"] .toggle .i-sun { display: none; }
  :root[data-theme="light"] .toggle .i-moon { display: block; }

  /* ---------- hero ---------- */
  .hero {
    padding: clamp(4rem, 12vw, 8rem) 0 clamp(3rem, 8vw, 5rem);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    top: 20%; right: -10%;
    width: 40%; height: 60%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    z-index: -1;
    filter: blur(60px);
  }
  .hero-grid { display: grid; gap: 1.5rem; }
  .signal-strip { width: 100%; height: 60px; display: block; margin-bottom: 1rem; }
  .hero h1 {
    font-size: var(--fs-hero);
    line-height: 1;
    letter-spacing: -0.04em;
    font-weight: 900;
    margin: 0;
    text-wrap: balance;
    background: linear-gradient(to bottom right, var(--ink) 50%, var(--muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero .role {
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-weight: 500;
    color: var(--muted);
    margin: 0.5rem 0;
    max-width: 35ch;
  }
  .stream {
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--accent-2);
    min-height: 1.5em;
    letter-spacing: 0.05em;
    opacity: 0.9;
  }
  .stream .cursor {
    display: inline-block;
    width: 0.6ch;
    background: var(--accent-2);
    color: transparent;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 8px var(--glow-2);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .avail {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 1rem;
  }
  .avail span { display: inline-flex; align-items: center; gap: 0.6rem; }
  .avail .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
  }

  .contacts {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.75rem 1.25rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    background: var(--surface-2);
    backdrop-filter: var(--glass);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn svg { width: 18px; height: 18px; }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 10px 20px -10px var(--glow);
    background: var(--surface);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    box-shadow: 0 4px 14px var(--glow);
  }
  .btn.primary:hover {
    background: #06b6d4;
    color: var(--bg);
    box-shadow: 0 6px 20px var(--glow);
  }

  /* ---------- section frame ---------- */
  section { padding: clamp(4rem, 10vw, 7rem) 0; }
  .sec-head {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 3.5rem;
  }
  .sec-head .idx {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    font-weight: 700;
  }
  .sec-head h2 {
    font-size: var(--fs-h2);
    letter-spacing: -0.03em;
    font-weight: 800;
    margin: 0;
  }

  .lede {
    max-width: 70ch;
    font-size: clamp(1.15rem, 2.5vw, 1.4rem);
    line-height: 1.6;
    color: var(--muted);
  }
  .lede strong { color: var(--ink); font-weight: 600; }

  /* ---------- timeline ---------- */
  .timeline { position: relative; padding-left: clamp(2rem, 6vw, 4rem); }
  .spine {
    position: absolute;
    left: 8px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: var(--line);
  }
  .spine .fill {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    height: 0%;
    background: linear-gradient(to bottom, var(--accent), var(--accent-2));
    box-shadow: 0 0 15px var(--accent);
  }
  .node {
    position: relative;
    padding: 0 0 3.5rem 0;
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .node.in { opacity: 1; transform: none; }
  .node::before {
    content: "";
    position: absolute;
    left: calc(-1 * clamp(2rem, 6vw, 4rem) + 1px);
    top: 8px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--accent);
    transform: translateX(-50%);
    z-index: 2;
  }
  .node.in::before { background: var(--accent); box-shadow: 0 0 12px var(--glow); }

  .node .year {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  .node h3 {
    font-size: 1.4rem;
    margin: 0.2rem 0;
    font-weight: 750;
    color: var(--ink);
  }
  .node .org {
    color: var(--muted);
    font-size: 1rem;
    margin: 0 0 1.2rem;
    font-weight: 500;
  }
  .node ul {
    margin: 0 0 1.2rem;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .node li {
    position: relative;
    padding-left: 1.5rem;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .node li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 700;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .tag {
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 20px;
    color: var(--muted);
    background: var(--surface-2);
  }

  /* ---------- skills ---------- */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
  }
  .skill-group {
    background: var(--surface);
    backdrop-filter: var(--glass);
    padding: 2rem;
    border-radius: 16px;
    border: 1px solid var(--line);
    transition: all 0.3s ease;
  }
  .skill-group:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 15px 30px -10px var(--glow); }
  .skill-group h3 {
    font-family: var(--mono);
    font-size: 0.8rem;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1.5rem;
    display: flex;
    justify-content: space-between;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip {
    font-size: 0.85rem;
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--muted);
    transition: all 0.2s;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); background: var(--surface); }

  /* ---------- projects ---------- */
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2rem; }
  .card {
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--surface);
    backdrop-filter: var(--glass);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 25px 50px -12px var(--glow);
  }
  .card:hover::before { opacity: 1; }
  .card .kicker {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 700;
  }
  .card h3 { font-size: 1.5rem; margin: 0; font-weight: 800; color: var(--ink); }
  .card p { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.5; }
  .card .live {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
    margin-top: auto;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    background: var(--glow);
    width: fit-content;
  }
  .card .live:hover { background: var(--accent); color: var(--bg); }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    padding: 4rem 0;
    margin-top: 4rem;
    background: var(--surface);
  }
  .foot { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: space-between; align-items: center; }
  .foot .mono { color: var(--muted); font-family: var(--mono); font-size: 0.8rem; }
  .foot a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .foot a:hover { color: var(--accent-2); }

  @media (max-width: 600px) {
    :root { --gutter: 1.25rem; }
    .hero h1 { font-size: 3rem; }
    .sec-head { margin-bottom: 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

  <section id="projects">

  <section id="about">

</main>

<footer>

    <span class="mono" id="footLeft"></span>
    <span class="mono" id="footRight"></span>
  </div>
</footer>

  (function () {
    "use strict";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function esc(s) {

        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function $(id) { return document.getElementById(id); }

    var ICONS = {
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',

      linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.4 8.65 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.3-2-3.3-2 0-2.3 1.56-2.3 3.2V21H9z"/></svg>',
      github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M9 7h8v8"/></svg>'
    };

    /* ---------- render from CV data ---------- */
    $("brandFull").textContent = CV.name.toUpperCase();
    $("eyebrow").textContent = CV.eyebrow;
    $("name").textContent = CV.name;
    $("role").textContent = CV.role;
    $("profileText").innerHTML = CV.profile;

    $("avail").innerHTML = CV.availability.map(function (a) {
      return "<span>" + (a.dot ? '<span class="dot"></span>' : "") + esc(a.text) + "</span>";
    }).join("");

    $("contacts").innerHTML = CV.contacts.map(function (c) {
      var ext = /^https?:/.test(c.href) ? ' target="_blank" rel="noopener"' : "";
      return '<a class="btn' + (c.primary ? " primary" : "") + '" href="' + esc(c.href) + '"' + ext + ">" +
        (ICONS[c.icon] || "") + esc(c.label) + "</a>";
    }).join("");

    $("timelineNodes").innerHTML = CV.experiences.map(function (e) {
      var bullets = e.bullets.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("");
      var tags = (e.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
      return '<article class="node">' +
        '<div class="year">' + esc(e.year) + "</div>" +
        "<h3>" + esc(e.title) + "</h3>" +
        '<p class="org">' + esc(e.org) + "</p>" +
        "<ul>" + bullets + "</ul>" +
        '<div class="tags">' + tags + "</div>" +
        "</article>";
    }).join("");

    $("skillsGrid").innerHTML = CV.skills.map(function (g, i) {
      var num = "/" + String(i + 1).padStart(2, "0");
      var chips = g.items.map(function (s) { return '<span class="chip">' + esc(s) + "</span>"; }).join("");
      return '<div class="skill-group"><h3><span class="num">' + num + "</span> " + esc(g.label) + "</h3>" +
        '<div class="chips">' + chips + "</div></div>";
    }).join("");

    $("projGrid").innerHTML = CV.projects.map(function (p) {
      var foot = p.link
        ? '<a class="live" href="' + esc(p.link.href) + '" target="_blank" rel="noopener">' + esc(p.link.label) + ICONS.external + "</a>"
        : (p.note ? '<span class="live" style="color:var(--muted)">' + esc(p.note) + "</span>" : "");
      return '<article class="card"><div class="kicker"><span>' + esc(p.kicker) + "</span><span>◆</span></div>" +
        "<h3>" + esc(p.title) + "</h3><p>" + esc(p.desc) + "</p>" + foot + "</article>";
    }).join("");

    $("eduBlock").innerHTML = CV.education.map(function (e) {
      return '<div class="meta-item"><div class="t">' + esc(e.title) + '</div><div class="s">' + esc(e.school) + "</div></div>";
    }).join("");

    $("langBlock").innerHTML = CV.languages.map(function (l) {
      return '<div class="lang-row"><span>' + esc(l.name) + '</span><span class="lv">' + esc(l.level) + "</span></div>";
    }).join("");

    $("footLeft").textContent = "© 2026 " + CV.name + " — " + CV.location;
    $("footRight").innerHTML = '<a href="mailto:' + esc(CV.email) + '">' + esc(CV.email) + "</a>";

    /* ---------- theme toggle ---------- */
    var root = document.documentElement;
    function current() {
      var set = root.getAttribute("data-theme");
      if (set) return set;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    $("themeToggle").addEventListener("click", function () {
      root.setAttribute("data-theme", current() === "dark" ? "light" : "dark");
    });

    /* ---------- streaming caption ---------- */
    var stream = $("stream");
    var phrases = CV.streamPhrases;
    if (reduce) {
      stream.textContent = phrases[phrases.length - 1];
    } else {
      var pi = 0, ci = 0;
      var txt = document.createTextNode("");
      var cur = document.createElement("span");
      cur.className = "cursor"; cur.textContent = ".";
      stream.appendChild(txt); stream.appendChild(cur);
      function tick() {
        var p = phrases[pi];
        if (ci <= p.length) { txt.nodeValue = p.slice(0, ci); ci++; setTimeout(tick, 34); }
        else { setTimeout(erase, 2100); }
      }
      function erase() {
        var p = phrases[pi];
        if (ci >= 0) { txt.nodeValue = p.slice(0, ci); ci--; setTimeout(erase, 12); }
        else { ci = 0; pi = (pi + 1) % phrases.length; setTimeout(tick, 260); }
      }
      setTimeout(tick, 650);
    }

    /* ---------- timeline reveal + spine fill ---------- */
    var nodes = Array.prototype.slice.call(document.querySelectorAll(".node"));
    if (reduce || !("IntersectionObserver" in window)) {
      nodes.forEach(function (n) { n.classList.add("in"); });
    } else {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.35, rootMargin: "0px 0px -8% 0px" });
      nodes.forEach(function (n) { io.observe(n); });
    }

    var fill = $("spineFill");
    var tl = $("timeline");
    function onScroll() {
      if (!fill || !tl) return;
      var r = tl.getBoundingClientRect();
      var vh = window.innerHeight;
      var total = r.height + vh * 0.4;
      var progressed = Math.min(Math.max(vh * 0.6 - r.top, 0), total);
      fill.style.height = (progressed / total * 100).toFixed(2) + "%";
    }
    if (!reduce) {
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      onScroll();
    } else if (fill) {
      fill.style.height = "100%";
    }

    /* ---------- nav active section ---------- */
    var links = Array.prototype.slice.call(document.querySelectorAll(".nav a.navlink"));
    if ("IntersectionObserver" in window) {
      var navio = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            var id = "#" + e.target.id;
            links.forEach(function (l) { l.classList.toggle("active", l.getAttribute("href") === id); });
          }
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      links.forEach(function (l) {
        var s = document.querySelector(l.getAttribute("href"));
        if (s) navio.observe(s);
      });
    }

    /* ---------- hero signal waveform ---------- */
    var cv = $("signal");
    if (cv && !reduce) {
      var ctx = cv.getContext("2d");
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = 0, h = 0;
      function size() {
        w = cv.clientWidth; h = cv.clientHeight;
        cv.width = w * dpr; cv.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      size();
      window.addEventListener("resize", size);
      var t = 0;
      function getCol(prop) { return getComputedStyle(root).getPropertyValue(prop).trim(); }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        var mid = h / 2;
        var col1 = getCol("--accent");
        var col2 = getCol("--accent-2");

        // Draw multiple waves for a "neural/data" feel
        drawWave(col1, 0.8, 0.05, 12, 0);
        drawWave(col2, 0.5, 0.03, 8, 1.5);
        drawWave(col1, 0.3, 0.08, 15, 3);

        function drawWave(color, alpha, speed, amp, offset) {
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = color;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          for (var x = 0; x <= w; x += 4) {
            var k = x / w;
            var env = Math.exp(-Math.pow((k - 0.5) * 4.5, 2));
            var y = mid + Math.sin(x * 0.04 + t * speed * 20 + offset) * amp * env +
                          Math.sin(x * 0.01 + t * speed * 10) * (amp/2) * env;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        // Animated "data point"
        var hx = (t * 60 % (w + 200)) - 100;
        if (hx >= 0 && hx <= w) {
            var k = hx / w;
            var env = Math.exp(-Math.pow((k - 0.5) * 4.5, 2));
            var hy = mid + Math.sin(hx * 0.04 + t * 0.05 * 20) * 12 * env;
            ctx.fillStyle = col1;
            ctx.globalAlpha = 1;
            ctx.beginPath(); ctx.arc(hx, hy, 3, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 10; ctx.shadowColor = col1;
            ctx.beginPath(); ctx.arc(hx, hy, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
        }

        t += 0.05;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    } else if (cv) {
      cv.style.display = "none";
    }
  })();
