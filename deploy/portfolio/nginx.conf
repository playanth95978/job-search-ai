# Serveur du portfolio statique (un seul index.html autonome, ~36 Ko).
#
# L'image nginx:alpine livre une configuration par défaut sans compression : la page part telle
# quelle sur le réseau. gzip la ramène autour de 8 Ko, ce qui compte sur mobile.
#
# TLS, HTTP/2 et la redirection HTTP -> HTTPS sont assurés par Traefik en amont : ce fichier ne
# s'occupe que de servir le fichier, en clair, sur le port 80 du conteneur.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Le site tient dans index.html, édité en place puis `docker restart jsa-portfolio` : il doit
    # être revalidé à chaque visite, sinon la mise à jour n'est jamais vue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Images et polices éventuellement ajoutées à côté : elles, peuvent être mises en cache.
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
