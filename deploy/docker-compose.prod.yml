# ===================================================================
# Production stack for job-search-ai (Hostinger VPS, behind an existing Traefik).
#
#   cd deploy
#   cp .env.example .env          # fill every value (incl. DOMAIN=...duckdns.org)
#   docker compose -f docker-compose.prod.yml up -d
#
# The app image is built with Jib from the project root:
#   npm run java:docker           # ./mvnw -Pprod ... jib:dockerBuild -> image "job-search-ai:latest"
#
# Reverse proxy / TLS is handled by your existing Traefik (host network, certresolver
# "letsencrypt", entrypoints web/websecure). The app is exposed to Traefik via the labels
# below — no public port is published, and Traefik reaches it on the project's default
# bridge network "job-search-ai_default".
# ===================================================================

name: job-search-ai

services:
  postgresql:
    image: paradedb/paradedb:latest
    container_name: jsa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  ollama:
    image: ollama/ollama:latest
    container_name: jsa-ollama
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: pulls the embedding models the app needs, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: jsa-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c', 'ollama pull nomic-embed-text && ollama pull mxbai-embed-large']
    restart: 'no'

  # One-shot: makes the ONNX volume writable by the app's non-root user (uid 1000).
  # Prépare les répertoires de modèles avant l'application : `/scripts` appartient à root (créé
  # implicitement par Docker au montage), l'utilisateur applicatif 1000 ne peut donc pas y créer de
  # sous-dossier lui-même. Chaque emplacement de modèle a besoin de son propre volume chowné.
  onnx-init:
    image: busybox
    container_name: jsa-onnx-init
    command:
      [
        'sh',
        '-c',
        'mkdir -p /scripts/onnxmodel /scripts/rerankers && chown -R 1000:1000 /scripts/onnxmodel /scripts/rerankers',
      ]
    volumes:
      - onnx-model:/scripts/onnxmodel
      - reranker-models:/scripts/rerankers
    restart: 'no'

  app:
    image: job-search-ai:latest
    container_name: jsa-app
    working_dir: /
    env_file:
      - .env
    environment:
      _JAVA_OPTIONS: ${JAVA_OPTS:--Xmx2g -Xms512m}
      SPRING_PROFILES_ACTIVE: prod
      OLLAMA_BASE_URL: http://ollama:11434
      SPRING_LIQUIBASE_URL: ${SPRING_DATASOURCE_URL}
      # Serveur MCP de recherche web (sidecar) exposé à l'agent Job Copilot.
      # Le sidecar fait partie de la stack (depends_on) : on peut activer le client MCP.
      MCP_WEB_SEARCH_ENABLED: 'true'
      WEB_SEARCH_MCP_URL: http://open-websearch:3000
    volumes:
      # Ancien reranker bge-reranker-v2-m3 (~570 Mo). Conservé le temps de valider le nouveau en
      # conditions réelles ; supprimable ensuite, avec son volume.
      - onnx-model:/scripts/onnxmodel
      # Reranker courant, bge-reranker-base (~280 Mo), téléchargé au premier démarrage. Le chemin
      # par défaut est relatif et `working_dir` vaut « / » : il se résout donc ici.
      - reranker-models:/scripts/rerankers
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 40
    depends_on:
      postgresql:
        condition: service_healthy
      ollama:
        condition: service_healthy
      onnx-init:
        condition: service_completed_successfully
      open-websearch:
        # service_healthy (et non service_started) : le client MCP de Spring AI se connecte au
        # démarrage et fait échouer tout le contexte si le serveur ne répond pas encore.
        condition: service_healthy
    restart: unless-stopped
    # Exposed through the existing Traefik (no public port). Traefik runs in host network
    # mode, so it reaches this container on the project's default bridge network.
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=job-search-ai_default'
      - 'traefik.http.routers.jsa.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.jsa.entrypoints=websecure'
      - 'traefik.http.routers.jsa.tls.certresolver=letsencrypt'
      - 'traefik.http.services.jsa.loadbalancer.server.port=8080'
      # Edge rate limit on the unauthenticated credential / mail-sending endpoints. These are the
      # only ones an anonymous caller can abuse at scale: password-reset and register each send an
      # e-mail per call (so they can be turned into a mail bomb aimed at a third party), and
      # /api/authenticate has no account lockout. Stopping them here rather than in the app keeps
      # the flood off the JVM entirely.
      #
      # Traefik attaches a middleware to a router, not to a path — hence a second router restricted
      # to those paths, with a higher priority so it wins over the catch-all `jsa` router. It
      # reuses the same `jsa` service, so there is no second upstream.
      #
      # Keyed by client IP (Traefik's default sourceCriterion), and Traefik is the edge, so it sees
      # the real address. Deliberately loose enough not to punish a shared/NAT address: this caps
      # abuse, it is NOT brute-force protection — that needs per-account lockout in the app.
      - 'traefik.http.middlewares.jsa-authlimit.ratelimit.average=10'
      - 'traefik.http.middlewares.jsa-authlimit.ratelimit.period=1m'
      - 'traefik.http.middlewares.jsa-authlimit.ratelimit.burst=20'
      - 'traefik.http.routers.jsa-auth.rule=Host(`${DOMAIN}`) && (Path(`/api/authenticate`) || Path(`/api/register`) || PathPrefix(`/api/account/reset-password`))'
      - 'traefik.http.routers.jsa-auth.priority=100'
      - 'traefik.http.routers.jsa-auth.entrypoints=websecure'
      - 'traefik.http.routers.jsa-auth.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.jsa-auth.middlewares=jsa-authlimit'
      - 'traefik.http.routers.jsa-auth.service=jsa'

  # MCP web-search server (aas-ee/open-websearch) : recherche web multi-moteurs, gratuite, sans clé,
  # sans Python. Exposé en HTTP/SSE sur le port 3000, l'app s'y connecte via WEB_SEARCH_MCP_URL.
  # Interne uniquement (pas de label Traefik, pas de port publié) : joignable seulement par jsa-app.
  open-websearch:
    image: ghcr.io/aas-ee/open-web-search:latest
    container_name: jsa-websearch
    environment:
      MODE: http
      PORT: '3000'
      DEFAULT_SEARCH_ENGINE: duckduckgo
      ENABLE_CORS: 'true'
      # Décommente pour router la recherche via un proxy sortant (utile si l'IP du VPS est bloquée) :
      # USE_PROXY: 'true'
      # PROXY_URL: http://mon-proxy:8080
    healthcheck:
      # Sonde la route /mcp : un GET y répond 400 (requête MCP malformée), ce qui prouve que le
      # serveur HTTP écoute ET que la route MCP est montée. On ne fait pas de vrai handshake
      # `initialize` exprès : il ouvrirait une session MCP à chaque sonde (fuite mémoire).
      test: ['CMD-SHELL', 'wget -q -S --spider http://127.0.0.1:3000/mcp 2>&1 | grep -q "HTTP/"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Static portfolio site (single self-contained HTML file), served on the cv.<DOMAIN> subdomain
  # through the same Traefik + Let's Encrypt setup. Independent of the app; edit ./portfolio/index.html
  # and `docker restart jsa-portfolio` to update.
  portfolio:
    image: nginx:alpine
    container_name: jsa-portfolio
    restart: unless-stopped
    volumes:
      - ./portfolio:/usr/share/nginx/html:ro
      # Remplace la conf par defaut de l'image, qui ne compresse rien : la page fait ~36 Ko.
      - ./portfolio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=job-search-ai_default'
      - 'traefik.http.routers.portfolio.rule=Host(`cv.${DOMAIN}`)'
      - 'traefik.http.routers.portfolio.entrypoints=websecure'
      - 'traefik.http.routers.portfolio.tls.certresolver=letsencrypt'
      - 'traefik.http.services.portfolio.loadbalancer.server.port=80'

volumes:
  postgres-data:
  ollama-models:
  onnx-model:
  reranker-models:
