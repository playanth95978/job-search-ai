name: CI/CD → VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois — annule le précédent si un push arrive en cours de build
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur GHCR

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 21 + cache Maven ───────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── 3. Node 24 + cache npm ─────────────────────────────────────────────
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 4. Install npm dependencies ────────────────────────────────────────
      - name: npm ci
        run: npm ci

      # ── 5. Build prod JAR + image Docker (Jib → GHCR) ────────────────────
      # Jib construit l'image sans Docker démon et la pousse directement sur GHCR.
      # Le profil -Pprod déclenche le build Angular via le plugin frontend-maven.
      - name: Build & push image (Jib)
        run: |
          ./mvnw -Pprod jib:build \
            -Djib.to.image=${{ env.IMAGE }} \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -DskipTests \
            --no-transfer-progress

      # ── 6. Deploy sur VPS ─────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_BASE64_SECRET: ${{ secrets.JWT_BASE64_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,SPRING_PROFILES_ACTIVE,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,JWT_BASE64_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,OLLAMA_BASE_URL,OLLAMA_MODEL,FRANCE_TRAVAIL_CLIENT_ID,FRANCE_TRAVAIL_CLIENT_SECRET
          script: |
            set -e

            echo "==> Login GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pull image $IMAGE"
            docker pull "$IMAGE"

            echo "==> Stop & remove old container"
            docker stop job-search-ai 2>/dev/null || true
            docker rm   job-search-ai 2>/dev/null || true

            echo "==> Start container"
            docker run -d \
              --name job-search-ai \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              -e SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              -e SPRING_LIQUIBASE_URL="$SPRING_DATASOURCE_URL" \
              -e JWT_BASE64_SECRET="$JWT_BASE64_SECRET" \
              -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
              -e GOOGLE_REDIRECT_URI="$GOOGLE_REDIRECT_URI" \
              -e OLLAMA_BASE_URL="$OLLAMA_BASE_URL" \
              -e OLLAMA_MODEL="$OLLAMA_MODEL" \
              -e FRANCE_TRAVAIL_CLIENT_ID="$FRANCE_TRAVAIL_CLIENT_ID" \
              -e FRANCE_TRAVAIL_CLIENT_SECRET="$FRANCE_TRAVAIL_CLIENT_SECRET" \
              "$IMAGE"

            echo "==> Nettoyage images obsolètes"
            docker image prune -f

            echo "==> Healthcheck"
            sleep 15
            docker inspect --format='{{.State.Status}}' job-search-ai
