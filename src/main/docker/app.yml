# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: job-search-ai
services:
  app:
    image: job-search-ai
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs,secret-samples
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/job-search-ai
      - SPRING_DATASOURCE_USERNAME=job-search-ai
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql:5432/job-search-ai
    volumes:
      # Modèles de reranking (~280 Mo), téléchargés au premier démarrage. Jib fixe le répertoire de
      # travail à « / » : le chemin relatif par défaut se résout donc en /scripts/rerankers. Le
      # volume évite de retélécharger à chaque redémarrage. Voir deploy/docker-compose.prod.yml pour
      # la préparation des droits (l'utilisateur applicatif ne peut pas créer de dossier sous /).
      - reranker-models:/scripts/rerankers
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET
          /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3;
          grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      postgresql:
        condition: service_healthy
  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql

# Persiste les modèles de reranking entre redémarrages : sans ce volume nommé, chaque relance
# du conteneur retéléchargerait ~280 Mo depuis HuggingFace.
volumes:
  reranker-models:
