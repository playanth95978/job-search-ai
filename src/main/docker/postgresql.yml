# This configuration is intended for development purpose.
# It's your responsibility to harden it for production.

name: job-search-ai

services:
  postgresql:
    image: paradedb/paradedb:latest
    container_name: job-search-ai-postgres

    environment:
      POSTGRES_DB: job-search-ai
      POSTGRES_USER: job-search-ai
      POSTGRES_PASSWORD: job-search-ai

    ports:
      - '127.0.0.1:5434:5432'

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres-data:
