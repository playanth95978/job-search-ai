<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title th:text="${cv.title} ?: 'CV'">CV</title>
  <style th:replace="~{cv/_base :: pageCss}" />
  <style th:if="${pageNumbers}" th:replace="~{cv/_base :: pageNumberCss}" />
  <style type="text/css">
    /* Full-bleed banner: the negative margins cancel the @page margins so the colour reaches the paper
       edge, the padding puts the text back where the margin box would have placed it. The preview's
       linear-gradient degrades to the flat primary — openhtmltopdf has no gradient support. */
    .m-head {
      background-color: [(${theme.primary})];
      color: #ffffff;
      margin: -13mm -14mm 7mm;
      padding: 9mm 14mm 7mm;
    }
    .m-head h1 { font-size: 1.9em; }
    .m-title { margin: 2mm 0 0; color: #eef0fb; }
    .m-contact { margin: 3mm 0 0; font-size: 0.8em; color: #eef0fb; }

    /* CSS 2.1 has no grid: the sidebar is a layout table. `-fs-table-paginate` lets a row taller than
       the page split instead of overflowing. This is the one template that uses a table for layout —
       the other three stay single-column, which parses more reliably in an ATS. */
    .m-body { width: 100%; border-collapse: collapse; -fs-table-paginate: paginate; }
    .m-body td { vertical-align: top; padding: 0; }
    .m-main { padding-right: 9mm !important; }
    .m-side { width: 52mm; }

    h2 {
      color: [(${theme.primary})];
      font-size: 1.05em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2mm;
      border-bottom: 2px solid [(${theme.primary})];
      padding-bottom: 1mm;
    }
    h3 {
      color: [(${theme.primary})];
      font-size: 0.92em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2mm;
    }

    .m-dates { color: #8a93a2; font-size: 0.8em; }
    .m-company { color: [(${theme.secondary})]; font-weight: 700; font-size: 0.88em; }

    .m-tags { margin-top: 1mm; }
    .m-tags span {
      display: inline-block;
      background-color: [(${theme.primarySoft})];
      color: [(${theme.primary})];
      border-radius: 8px;
      padding: 0 2mm;
      margin: 0 1mm 1mm 0;
      font-size: 0.76em;
    }

    .m-skill { margin-bottom: 2mm; font-size: 0.84em; page-break-inside: avoid; }
    .m-bar { background-color: #e7eaf0; height: 5px; margin-top: 1mm; }
    .m-bar i { display: block; height: 5px; background-color: [(${theme.primary})]; }

    .m-lang, .m-cert { font-size: 0.84em; margin-bottom: 1.5mm; page-break-inside: avoid; }
    .m-lang em { float: right; font-style: normal; color: #8a93a2; }
    .m-cert span { display: block; color: #8a93a2; font-size: 0.92em; }
  </style>
</head>
<body>

  <header class="m-head">
    <h1 th:text="${cv.fullName()}">Prénom Nom</h1>
    <p class="m-title" th:if="${cv.personal.title}" th:text="${cv.personal.title}">Titre</p>
    <div class="m-contact" th:if="${!#strings.isEmpty(cv.contactLine())}" th:text="${cv.contactLine()}">contact</div>
  </header>

  <table class="m-body">
    <tr>
      <td class="m-main">
        <th:block th:each="s : ${sections}" th:switch="${s}">

          <th:block th:case="'summary'">
            <section th:if="${cv.summary}">
              <h2>Profil</h2>
              <p th:text="${cv.summary}">…</p>
            </section>
          </th:block>

          <th:block th:case="'experiences'">
            <section th:if="${!cv.experiences.isEmpty()}">
              <h2>Expérience</h2>
              <article class="entry" th:each="e : ${cv.experiences}">
                <div class="row">
                  <strong th:text="${e.jobTitle}">Poste</strong>
                  <span class="dates m-dates" th:text="${e.dateRange('Aujourd''hui')}">dates</span>
                </div>
                <div class="m-company" th:if="${e.company}" th:text="${e.company}">Société</div>
                <p th:if="${e.description}" th:text="${e.description}">…</p>
                <ul th:if="${!e.achievements.isEmpty()}">
                  <li th:each="a : ${e.achievements}" th:text="${a}">…</li>
                </ul>
              </article>
            </section>
          </th:block>

          <th:block th:case="'education'">
            <section th:if="${!cv.education.isEmpty()}">
              <h2>Formation</h2>
              <article class="entry" th:each="ed : ${cv.education}">
                <div class="row">
                  <strong th:text="${ed.degree}">Diplôme</strong>
                  <span class="dates m-dates" th:text="${ed.dateRange()}">dates</span>
                </div>
                <div class="m-company" th:if="${ed.school}" th:text="${ed.school}">École</div>
                <p th:if="${ed.description}" th:text="${ed.description}">…</p>
              </article>
            </section>
          </th:block>

          <th:block th:case="'projects'">
            <section th:if="${!cv.projects.isEmpty()}">
              <h2>Projets</h2>
              <article class="entry" th:each="p : ${cv.projects}">
                <strong th:text="${p.name}">Projet</strong>
                <p th:if="${p.description}" th:text="${p.description}">…</p>
                <div class="m-tags" th:if="${!p.technologies.isEmpty()}">
                  <span th:each="t : ${p.technologies}" th:text="${t}">tech</span>
                </div>
              </article>
            </section>
          </th:block>

        </th:block>
      </td>

      <td class="m-side">
        <th:block th:each="s : ${sections}" th:switch="${s}">

          <th:block th:case="'skills'">
            <section th:if="${!cv.skills.isEmpty()}">
              <h3>Compétences</h3>
              <div class="m-skill" th:each="sk : ${cv.skills}">
                <span th:text="${sk.name}">compétence</span>
                <div class="m-bar"><i th:style="'width:' + ${sk.barWidth()} + '%'"></i></div>
              </div>
            </section>
          </th:block>

          <th:block th:case="'languages'">
            <section th:if="${!cv.languages.isEmpty()}">
              <h3>Langues</h3>
              <div class="m-lang" th:each="l : ${cv.languages}">
                <em th:text="${l.level}">niveau</em>
                <span th:text="${l.name}">langue</span>
              </div>
            </section>
          </th:block>

          <th:block th:case="'certifications'">
            <section th:if="${!cv.certifications.isEmpty()}">
              <h3>Certifications</h3>
              <div class="m-cert" th:each="c : ${cv.certifications}">
                <strong th:text="${c.name}">certification</strong>
                <span th:text="${c.issuedLine()}">émetteur</span>
              </div>
            </section>
          </th:block>

        </th:block>
      </td>
    </tr>
  </table>

</body>
</html>
