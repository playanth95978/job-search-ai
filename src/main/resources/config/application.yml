# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: job-search-ai
  ai:
    mistral:
      rate-limit:
        requests-per-second: 3 # limite client le débit vers Mistral pour éviter les 429
    chat:
      observations:
        log-completion: true
        log-prompt: true
    model:
      chat: mistral # change model to disabled auto configuration for mistral configuration instance
    mistralai:
      enabled: true
      api-key: ${MISTRALAI_API_KEY:}
      chat:
        temperature: 0.1
        max-tokens: 5000
        top-: 1.0
        model: mistral-medium-3.5
    openai:
      api-key: disabled
      enabled: false
    ollama:
      init:
        pull-model-strategy: always
        embedding:
          additional-models:
            - mxbai-embed-large
            - nomic-embed-text
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    mcp:
      client:
        # ATTENTION : si le serveur MCP est injoignable au démarrage, l'auto-configuration Spring AI
        # fait échouer TOUT le contexte ("Client failed to initialize by explicit API call").
        # D'où ce commutateur : en local, laisser à false tant que le conteneur open-websearch
        # n'est pas lancé avec son port publié (docker run -p 3000:3000 ...).
        # En prod, le sidecar fait partie du compose : la variable y est mise à true.
        enabled: ${MCP_WEB_SEARCH_ENABLED:false}
        # Outils MCP externes exposés à l'agent Job Copilot : recherche web d'offres d'emploi.
        # Serveur open-websearch (aas-ee/open-websearch) : multi-moteurs (duckduckgo, bing, brave...),
        # gratuit, sans clé API, sans Python. Lancé comme conteneur sidecar en HTTP -> on s'y connecte
        # en Streamable HTTP (endpoint /mcp par défaut ; SSE est déprécié en Spring AI 2.0).
        # URL surchargeable par env. Dev : http://localhost:3000. Prod : http://open-websearch:3000.
        streamable-http:
          connections:
            web-search:
              url: ${WEB_SEARCH_MCP_URL:http://localhost:3000}
  batch:
    # Jobs are launched by the application's schedulers (ingestion, purge), never at startup.
    # Without this, Spring Boot's JobLauncherApplicationRunner tries to run jobs on boot and fails
    # with "Job name must be specified in case of multiple jobs" once there is more than one Job bean.
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: job-search-ai-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: job-search-ai-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

