---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
application:
  seo:
    # Public base URL (scheme + host, no trailing slash) used to build absolute URLs in sitemap.xml.
    base-url: ${SEO_BASE_URL:https://aicarreerfinder.com}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      token: ${OLLAMA_TOKEN:500bdabb06bf48d1954498b694f30030.8BDqI18mRi5HRt0PylrqyWDJ} # set your own token here from ollama web ui if you want to use cloud model.
      model: ${OLLAMA_MODEL:nemotron-3-super:cloud} # set your own model here, you can find more models here: https://ollama.com/library
      enabled: true
      # Read timeout for Ollama calls; raise on CPU-only hosts where embeddings are slow.
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}
    embedding:
      docs:
        model: nomic-embed-text
      code:
        model: mxbai-embed-large
    vector-store:
      pdf:
        table: vector_pdf
      jira:
        table: vector_jira # table name for jira docs embeddings using nomic-embed-text model
      docs:
        table: vector_docs # table name for docs embeddings using nomic-embed-text model
      code:
        table: vector_code # table name for code embeddings using mxbai-embed-large model

  job-copilot:
    france-travail:
      client-id: ${FRANCE_TRAVAIL_CLIENT_ID:PAR_test_d0cacdd0542c139ddd80e157eeb917e93d6c281f6a4d00060f45b5028a5f64c3}
      client-secret: ${FRANCE_TRAVAIL_CLIENT_SECRET:}
      # Comma-separated INSEE département codes crossed with each ROME grand domaine partition.
      # Blank = national partitions (one per grand domaine). Add département codes to break past the
      # API's 3150-results-per-query ceiling for very large domaines (e.g. "75,69,13,33,59,44").
      departements: ${FRANCE_TRAVAIL_DEPARTEMENTS:}
    ingestion:
      # Chunk size for the mass-ingestion steps (offers dedup'd + saved per chunk).
      chunk-size: ${INGESTION_CHUNK_SIZE:150}
      # Number of ROME grand domaine partitions ingested in parallel (virtual threads).
      concurrency: ${INGESTION_CONCURRENCY:6}
      # Max offers a step may skip on error before failing the whole step.
      skip-limit: ${INGESTION_SKIP_LIMIT:1000}
      # Default lifetime (days) stamped on ingested offers with no source expiry, so the purge can act.
      offer-ttl-days: ${OFFER_TTL_DAYS:30}
    purge:
      # Suppression quotidienne des offres expirées (expires_at dépassé). Les offres liées à une
      # candidature sont conservées (historique utilisateur) mais restent masquées des recherches.
      # Programmée à 4 h, après l'ingestion de 2 h ; annulée si celle-ci tourne encore.
      cron: ${PURGE_CRON:0 0 4 * * *}
      # Offres supprimées par lot, une transaction par lot.
      batch-size: ${PURGE_BATCH_SIZE:500}
      # Lots supprimés en parallèle (threads virtuels) ; rester sous la taille du pool JDBC.
      concurrency: ${PURGE_CONCURRENCY:4}
      # Plafond par exécution ; le reliquat part au run suivant.
      max-per-run: ${PURGE_MAX_PER_RUN:50000}
    gdpr:
      # Purge des données personnelles au-delà de la durée de conservation (RGPD art. 5-1-e).
      # Programmée à 5 h, après l'ingestion (2 h) et la purge des offres (4 h) ; annulée si l'une
      # d'elles tourne encore. Efface profil candidat, CV, candidatures, positionnements, radar,
      # préférences et conversations — pas le compte lui-même, qui relève d'une demande d'effacement.
      enabled: ${GDPR_PURGE_ENABLED:true}
      cron: ${GDPR_PURGE_CRON:0 0 5 * * *}
      # Conservation à compter de la DERNIÈRE activité de l'utilisateur, pas de la création de la
      # ligne : 730 jours = 2 ans, recommandation CNIL pour les données de candidature.
      retention-days: ${GDPR_RETENTION_DAYS:730}
      # Utilisateurs traités par transaction.
      batch-size: ${GDPR_PURGE_BATCH_SIZE:100}
    liveness:
      # Vérifie que les apply_url stockées répondent encore ; 404/410 => offre marquée expirée.
      # Ne re-teste pas une offre vérifiée depuis moins de N heures.
      recheck-hours: ${LIVENESS_RECHECK_HOURS:24}
      batch-size: ${LIVENESS_BATCH_SIZE:25}
      concurrency: ${LIVENESS_CONCURRENCY:4}
      max-per-run: ${LIVENESS_MAX_PER_RUN:2000}
      http-timeout-seconds: ${LIVENESS_HTTP_TIMEOUT:6}
    radar:
      # Opportunity Radar: proactively match newly ingested offers against each user's profile.
      enabled: ${RADAR_ENABLED:true}
      threshold: ${RADAR_THRESHOLD:0.65}
      candidate-limit: ${RADAR_CANDIDATE_LIMIT:100}
      max-per-scan: ${RADAR_MAX_PER_SCAN:10}
      initial-window-days: ${RADAR_INITIAL_WINDOW_DAYS:3}
      scan-interval-ms: ${RADAR_SCAN_INTERVAL_MS:900000}
    seek:
      # Seek (AU) is protected by bot mitigation (Kasada); server-side scraping is blocked (403).
      # Disabled by default — the connector bean is only registered when this is true.
      enabled: ${SEEK_ENABLED:false}
    adzuna:
      # Free credentials from https://developer.adzuna.com/ — leave blank to disable the connector.
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
      # Adzuna country code (fr, gb, us, de, au…). No New Caledonia endpoint — EmploiNc covers local offers.
      country: ${ADZUNA_COUNTRY:fr}
      # Optional location filter; blank = whole country.
      where: ${ADZUNA_WHERE:}
      results-per-page: 50
      max-pages: 5
      # Seed "what" queries paged through by the daily ingestion batch.
      queries: ${ADZUNA_QUERIES:développeur,architecte,data engineer,devops,software engineer,cloud,cybersécurité,product manager}

# ===================================================================
# Reranking (cross-encoder ONNX)
#
# Clés hors du préfixe `application.` : ApplicationProperties est en ignoreUnknownFields=false,
# tout ajout sous `application.` exigerait une classe correspondante.
#
# Les modèles ne sont pas versionnés (~280 Mo) : exécuter ./scripts/download-rerankers.sh sur
# la machine avant le premier démarrage, sinon l'application s'arrête avec un message explicite.
# ===================================================================
reranker:
  # bge-reranker-base (278 M, INT8, multilingue) : 2,9x plus rapide que bge-reranker-v2-m3 pour la
  # meilleure fidélité de classement des candidats mesurés.
  #
  # REPLI si le CPU du VPS reste insuffisant — mmarco-mMiniLMv2-L12 (118 M), 7,3x plus rapide mais
  # classement plus éloigné. Changer les DEUX lignes ensemble, modèle et tokenizer sont solidaires :
  #   model-path: scripts/rerankers/mminilm/model.onnx
  #   tokenizer-path: scripts/rerankers/mminilm/tokenizer.json
  model-path: ${RERANKER_MODEL_PATH:scripts/rerankers/bge-base/model.onnx}
  tokenizer-path: ${RERANKER_TOKENIZER_PATH:scripts/rerankers/bge-base/tokenizer.json}
  # Sources téléchargées au démarrage si les fichiers ci-dessus sont absents. Les QUATRE lignes
  # (chemins + URL) se règlent ensemble : pour le repli mMiniLM, viser
  #   https://huggingface.co/cross-encoder/mmarco-mMiniLMv2-L12-H384-v1/resolve/main/onnx/model_qint8_avx512_vnni.onnx
  #   https://huggingface.co/cross-encoder/mmarco-mMiniLMv2-L12-H384-v1/resolve/main/tokenizer.json
  model-url: ${RERANKER_MODEL_URL:https://huggingface.co/onnx-community/bge-reranker-base-ONNX/resolve/main/onnx/model_int8.onnx}
  tokenizer-url: ${RERANKER_TOKENIZER_URL:https://huggingface.co/onnx-community/bge-reranker-base-ONNX/resolve/main/tokenizer.json}
  # Troncature des offres, en tokens. Mesuré sur bge-reranker-base : 128 au lieu de 256 rapporte
  # ~1,8x pour une corrélation de rangs de ~0,83. Ne pas descendre à 64, le top-1 s'effondre.
  job-offer-max-length: ${RERANKER_MAX_LENGTH:128}
  # Threads ONNX par inférence ; 0 = tous les cœurs. Mesuré : brider dégrade débit ET latence.
  intra-op-threads: ${RERANKER_INTRA_OP_THREADS:0}
  # Inférences simultanées ; 0 = illimité. Borner stabilise le p95 sous charge sans gagner de débit.
  max-concurrent-inferences: ${RERANKER_MAX_CONCURRENT:0}
