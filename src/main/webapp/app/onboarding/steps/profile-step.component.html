<jhi-step-hero icon="user" [title]="'onboarding.profile.title' | translate" [subtitle]="'onboarding.profile.subtitle' | translate" />

<form [formGroup]="form()" class="ob-grid">
  <div class="ob-field">
    <label class="ob-label" jhiTranslate="onboarding.profile.firstName">Prénom</label>
    <input class="ob-input" type="text" formControlName="firstName" />
  </div>
  <div class="ob-field">
    <label class="ob-label" jhiTranslate="onboarding.profile.lastName">Nom</label>
    <input class="ob-input" type="text" formControlName="lastName" />
  </div>
  <div class="ob-field ob-grid-full">
    <label class="ob-label" jhiTranslate="onboarding.profile.headline">Titre / poste visé</label>
    <input class="ob-input" type="text" formControlName="title" />
  </div>
  <div class="ob-field ob-grid-full">
    <label class="ob-label" jhiTranslate="onboarding.profile.location">Localisation</label>
    <input class="ob-input" type="text" formControlName="location" />
  </div>
</form>
