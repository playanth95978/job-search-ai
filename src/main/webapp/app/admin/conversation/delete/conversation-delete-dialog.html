@if (conversation) {
  <form (ngSubmit)="confirmDelete(conversation.id!)" name="deleteForm">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="conversationDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmation de suppression</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        [translateValues]="{ id: conversation.id }"
        id="jhi-delete-conversation-heading"
        jhiTranslate="aiassistantApp.conversation.delete.question"
      >
        Êtes-vous certain de vouloir supprimer le Conversation {{ conversation.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button (click)="cancel()" class="btn btn-secondary" data-dismiss="modal" type="button">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button class="btn btn-danger" data-cy="entityConfirmDeleteButton" id="jhi-confirm-delete-conversation" type="submit">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
