<div class="robot-container">
  <svg class="ai-robot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Body -->
    <rect fill="#2d3748" height="70" rx="15" width="80" x="60" y="80" />
    <rect fill="#4a5568" height="50" rx="10" width="60" x="70" y="90" />

    <!-- Head -->
    <g class="head">
      <rect fill="#2d3748" height="50" rx="20" width="70" x="65" y="30" />
      <!-- Screen/Face -->
      <rect fill="#1a202c" height="34" rx="10" width="50" x="75" y="38" />
      <!-- Eyes -->
      <circle class="eye" cx="88" cy="55" r="4" />
      <circle class="eye" cx="112" cy="55" r="4" />
      <!-- Antenna -->
      <line stroke="#2d3748" stroke-width="4" x1="100" x2="100" y1="30" y1="15" />
      <circle class="antenna-light" cx="100" cy="12" r="5" />
    </g>

    <!-- Arms -->
    <rect fill="#2d3748" height="40" rx="7" width="15" x="45" y="90" />
    <rect fill="#2d3748" height="40" rx="7" width="15" x="140" y="90" />
  </svg>
</div>
