<div class="chip-input" [class.disabled]="disabled()">
  @for (chip of chips(); track chip) {
    <span class="jc-skill-tag chip">
      {{ chip }}
      <button type="button" class="chip-remove" (click)="remove(chip)" [disabled]="disabled()" aria-label="remove">
        <fa-icon icon="xmark" />
      </button>
    </span>
  }
  <input
    #chipField
    type="text"
    class="chip-field"
    [disabled]="disabled()"
    (keydown.enter)="add($event, chipField)"
    (blur)="add($event, chipField)"
  />
</div>
