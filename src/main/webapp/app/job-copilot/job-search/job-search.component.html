<div class="jc-search">
  <div class="jc-search-header">
    <h1 jhiTranslate="jobCopilot.search.title">Job Search</h1>
    <p jhiTranslate="jobCopilot.search.subtitle">
      Search across multiple sources — Emploi.nc, RemoteOK, Greenhouse, HelloWork, Seek AU, France Travail
    </p>
  </div>

  <jhi-job-search-form
    [searching]="searching()"
    [smartSearching]="smartSearching()"
    [matching]="matching()"
    [matchingAdvanced]="matchingAdvanced()"
    [fetching]="fetching()"
    [suggestingBoards]="suggestingBoards()"
    [boardSuggestions]="boardSuggestions()"
    [boardsSuggested]="boardsSuggested()"
    (search)="onSearch($event)"
    (smartSearch)="onSmartSearch($event)"
    (matchAll)="onMatchAll($event)"
    (matchAdvanced)="onMatchAdvanced($event)"
    (fetchUrl)="onFetch($event)"
    (suggestBoards)="onSuggestBoards()"
  />

  @if (error()) {
    <div class="jc-error"><fa-icon icon="circle-exclamation"></fa-icon> {{ error() }}</div>
  }

  <div class="jc-results-layout" [class.has-detail]="!!selectedOffer()">
    <div class="jc-results-col">
      <jhi-job-results
        [offers]="offers()"
        [matchResults]="matchResults()"
        [selectedId]="selectedOffer()?.id ?? null"
        (selectOffer)="selectOffer($event)"
        (apply)="openApplyModal($event)"
      />
    </div>

    @if (selectedOffer(); as sel) {
      <jhi-job-search-detail
        [sel]="sel"
        [selectedLoading]="selectedLoading()"
        (close)="selectedOffer.set(null)"
        (apply)="openApplyModal($event)"
      />
    }
  </div>
</div>
