@let r = store.resume();

<div class="cv-builder">
  <!-- Toolbar -->
  <header class="cv-toolbar">
    <div class="cv-toolbar-left">
      <input
        class="cv-title"
        [ngModel]="r.title"
        (ngModelChange)="store.setTitle($event)"
        [attr.aria-label]="'cvBuilder.title' | translate"
      />
      @if (store.savedAt(); as saved) {
        <span class="cv-saved"
          ><fa-icon icon="circle-check" /> <span jhiTranslate="cvBuilder.saved">Enregistré</span> {{ saved | date: 'HH:mm:ss' }}</span
        >
      }
    </div>

    <div class="cv-toolbar-right">
      <!-- Undo / Redo -->
      <button
        type="button"
        class="cv-tool"
        [disabled]="!store.canUndo()"
        (click)="store.undo()"
        [title]="'cvBuilder.actions.undo' | translate"
      >
        <fa-icon icon="rotate-left" />
      </button>
      <button
        type="button"
        class="cv-tool"
        [disabled]="!store.canRedo()"
        (click)="store.redo()"
        [title]="'cvBuilder.actions.redo' | translate"
      >
        <fa-icon icon="rotate-right" />
      </button>

      <span class="cv-divider"></span>

      <!-- Export -->
      <button type="button" class="cv-tool" (click)="loadProfile()" [title]="'cvBuilder.export.import-profile' | translate">
        <fa-icon icon="sync" />
      </button>
      <button type="button" class="cv-tool" (click)="exportPdf()" [title]="'cvBuilder.export.pdf' | translate">
        <fa-icon icon="file-pdf" />
      </button>
      <button type="button" class="cv-tool" (click)="exportDocx()" [title]="'cvBuilder.export.docx' | translate">
        <fa-icon icon="file-word" />
      </button>
      <button type="button" class="cv-tool" (click)="exportJson()" [title]="'cvBuilder.export.json' | translate">
        <fa-icon icon="download" />
      </button>
      <label class="cv-tool" [title]="'cvBuilder.export.import' | translate">
        <fa-icon icon="file-arrow-up" />
        <input type="file" accept="application/json" hidden (change)="importJson($event)" />
      </label>
    </div>
  </header>

  <!-- Customization bar -->
  <div class="cv-custombar">
    <div class="cv-templates">
      @for (t of templates; track t.id) {
        <button type="button" class="cv-tmpl" [class.active]="r.template === t.id" (click)="store.setTemplate(t.id)">
          <span [jhiTranslate]="t.labelKey">{{ t.id }}</span>
        </button>
      }

      <span class="cv-divider"></span>

      <div class="cv-translate-group">
        <select
          [ngModel]="translationLanguage()"
          (ngModelChange)="translationLanguage.set($event)"
          class="cv-lang-select"
          [attr.aria-label]="'cvBuilder.translate.ariaLabel' | translate"
        >
          @for (lang of translateLanguages; track lang.value) {
            <option [value]="lang.value">{{ lang.labelKey | translate }}</option>
          }
        </select>
        <button
          type="button"
          class="cv-tool"
          (click)="translateCv()"
          [disabled]="translating()"
          [title]="'cvBuilder.translate.button' | translate"
        >
          @if (translating()) {
            <fa-icon icon="circle-notch" [animation]="'spin'" />
          } @else {
            <fa-icon icon="language" />
          }
        </button>
      </div>
    </div>

    <div class="cv-theme">
      <label [title]="'cvBuilder.theme.primary' | translate">
        <fa-icon icon="palette" />
        <input type="color" [ngModel]="r.theme.primaryColor" (ngModelChange)="store.patchTheme({ primaryColor: $event })" />
      </label>
      <label [title]="'cvBuilder.theme.secondary' | translate">
        <input type="color" [ngModel]="r.theme.secondaryColor" (ngModelChange)="store.patchTheme({ secondaryColor: $event })" />
      </label>
      <select
        [ngModel]="r.theme.fontFamily"
        (ngModelChange)="store.patchTheme({ fontFamily: $event })"
        [title]="'cvBuilder.theme.font' | translate"
      >
        @for (f of fonts; track f.value) {
          <option [value]="f.value">{{ f.label }}</option>
        }
      </select>
      <label class="cv-size" [title]="'cvBuilder.theme.fontSize' | translate">
        <fa-icon icon="text-height" />
        <input type="range" min="11" max="18" [ngModel]="r.theme.fontSize" (ngModelChange)="store.patchTheme({ fontSize: +$event })" />
      </label>
    </div>
  </div>

  <!-- Split screen -->
  <div class="cv-split">
    <section class="cv-editor-pane">
      <div class="w-100 mb-3 cv-ai-bar">
        <div class="cv-ai-head">
          <ul ngbNav #aiNav="ngbNav" class="nav cv-ai-tabs">
            <li [ngbNavItem]="'generate'">
              <a ngbNavLink>
                <fa-icon icon="wand-magic-sparkles" /> <span jhiTranslate="cvBuilder.generate.button">Générer avec l'IA</span>
              </a>
              <ng-template ngbNavContent>
                <jhi-cv-generate />
              </ng-template>
            </li>
            <li [ngbNavItem]="'review'">
              <a ngbNavLink> <fa-icon icon="wand-magic-sparkles" /> <span jhiTranslate="cvBuilder.review.button">Revue IA</span> </a>
              <ng-template ngbNavContent>
                <jhi-cv-review [resume]="r" />
              </ng-template>
            </li>
            <li [ngbNavItem]="'match'">
              <a ngbNavLink> <fa-icon icon="bullseye" /> <span jhiTranslate="cvBuilder.match.button">Match avec une offre</span> </a>
              <ng-template ngbNavContent>
                <jhi-cv-match [resume]="r" />
              </ng-template>
            </li>
          </ul>
        </div>
        <div class="cv-ai-body">
          <div [ngbNavOutlet]="aiNav"></div>
        </div>
      </div>
      <jhi-cv-editor />
    </section>
    <section class="cv-preview-pane">
      <jhi-cv-preview [resume]="r" />
    </section>
  </div>
</div>
