<div class="cv-match">
  @if (!open()) {
    <button type="button" class="cv-match-btn" (click)="open.set(true)">
      <fa-icon icon="bullseye" /> <span jhiTranslate="cvBuilder.match.button">Match avec une offre</span>
    </button>
  } @else {
    <div class="cv-match-panel">
      <div class="cv-match-head">
        <span jhiTranslate="cvBuilder.match.title">Match avec une offre</span>
        <button type="button" class="cv-match-close" (click)="open.set(false)"><fa-icon icon="xmark" /></button>
      </div>

      <textarea
        rows="5"
        [ngModel]="offer()"
        (ngModelChange)="offer.set($event)"
        [placeholder]="'cvBuilder.match.placeholder' | translate"
      ></textarea>

      <button type="button" class="cv-match-run" [disabled]="!offer().trim() || loading()" (click)="run()">
        @if (loading()) {
          <fa-icon icon="circle-notch" [animation]="'spin'" />
        } @else {
          <fa-icon icon="bullseye" />
        }
        <span jhiTranslate="cvBuilder.match.run">Analyser</span>
      </button>

      @if (error(); as err) {
        <div class="cv-match-error"><fa-icon icon="circle-exclamation" /> {{ err }}</div>
      }

      @if (result(); as m) {
        <jhi-match-result [result]="m" />
      }
    </div>
  }
</div>
