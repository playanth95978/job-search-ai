<div class="jc-settings">
  <div class="jc-settings-header">
    <h1 jhiTranslate="jobCopilot.settings.title">Job Preferences</h1>
    <p jhiTranslate="jobCopilot.settings.subtitle">Configure your job search criteria to get better matches</p>
  </div>

  <form (ngSubmit)="save()" class="jc-form">
    <div class="jc-form-section">
      <h3 jhiTranslate="jobCopilot.settings.workType.title"><fa-icon icon="briefcase"></fa-icon> Work Type</h3>
      <div class="jc-form-row">
        <label class="jc-toggle">
          <input type="checkbox" [(ngModel)]="prefs.remoteOnly" name="remoteOnly" />
          <span class="jc-toggle-slider"></span>
          <span class="jc-toggle-label" jhiTranslate="jobCopilot.settings.workType.remoteOnly">Remote only</span>
        </label>
      </div>
      <div class="jc-form-row">
        <label class="jc-label" jhiTranslate="jobCopilot.settings.workType.contractType">Contract Type</label>
        <select class="jc-select" [(ngModel)]="prefs.contractType" name="contractType">
          <option value="" jhiTranslate="jobCopilot.settings.workType.any">Any</option>
          <option value="CDI">CDI</option>
          <option value="CDD">CDD</option>
          <option value="Freelance">Freelance</option>
          <option value="Internship">Internship</option>
        </select>
      </div>
    </div>

    <div class="jc-form-section">
      <h3 jhiTranslate="jobCopilot.settings.salary.title"><fa-icon icon="chart-line"></fa-icon> Salary Range</h3>
      <div class="jc-form-grid">
        <div>
          <label class="jc-label" jhiTranslate="jobCopilot.settings.salary.min">Minimum (€/year)</label>
          <input type="number" class="jc-input" [(ngModel)]="prefs.salaryMin" name="salaryMin" placeholder="e.g. 40000" />
        </div>
        <div>
          <label class="jc-label" jhiTranslate="jobCopilot.settings.salary.max">Maximum (€/year)</label>
          <input type="number" class="jc-input" [(ngModel)]="prefs.salaryMax" name="salaryMax" placeholder="e.g. 80000" />
        </div>
      </div>
    </div>

    <div class="jc-form-section">
      <h3 jhiTranslate="jobCopilot.settings.preferences.title"><fa-icon icon="star"></fa-icon> Preferences</h3>
      <div class="jc-form-row">
        <label class="jc-label" jhiTranslate="jobCopilot.settings.preferences.roles">Preferred Roles</label>
        <input
          type="text"
          class="jc-input"
          [(ngModel)]="rolesInput"
          name="roles"
          [placeholder]="'jobCopilot.settings.preferences.roles' | translate"
        />
        <span class="jc-hint" jhiTranslate="jobCopilot.settings.preferences.rolesHint">Comma separated</span>
      </div>
      <div class="jc-form-row">
        <label class="jc-label" jhiTranslate="jobCopilot.settings.preferences.excluded">Excluded Technologies</label>
        <input
          type="text"
          class="jc-input"
          [(ngModel)]="excludedInput"
          name="excluded"
          [placeholder]="'jobCopilot.settings.preferences.excluded' | translate"
        />
        <span class="jc-hint" jhiTranslate="jobCopilot.settings.preferences.excludedHint">Technologies you want to avoid</span>
      </div>
      <div class="jc-form-row">
        <label class="jc-label" jhiTranslate="jobCopilot.settings.preferences.locations">Preferred Locations</label>
        <input
          type="text"
          class="jc-input"
          [(ngModel)]="locationsInput"
          name="locations"
          [placeholder]="'jobCopilot.settings.preferences.locations' | translate"
        />
        <span class="jc-hint" jhiTranslate="jobCopilot.settings.preferences.locationsHint">Comma separated</span>
      </div>
    </div>

    <div class="jc-form-actions">
      <button type="submit" class="jc-btn jc-btn-primary" [disabled]="saving()">
        @if (saving()) {
          <fa-icon icon="circle-notch" [animation]="'spin'"></fa-icon>
          <span jhiTranslate="jobCopilot.settings.actions.saving">Saving...</span>
        } @else {
          <fa-icon icon="save"></fa-icon> <span jhiTranslate="jobCopilot.settings.actions.save">Save Preferences</span>
        }
      </button>
      @if (saved()) {
        <span class="jc-saved"
          ><fa-icon icon="circle-check"></fa-icon> <span jhiTranslate="jobCopilot.settings.actions.saved">Saved!</span></span
        >
      }
    </div>
  </form>
</div>
