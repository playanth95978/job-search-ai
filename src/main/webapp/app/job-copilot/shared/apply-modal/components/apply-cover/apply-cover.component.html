@if (loading()) {
  <div class="jc-modal-loading">
    <fa-icon [animation]="'spin'" icon="circle-notch"></fa-icon>
    <span jhiTranslate="jobCopilot.applyModal.loading">Génération de la lettre de motivation...</span>
  </div>
} @else if (application()) {
  <div class="jc-modal-body-inner">
    <div class="jc-modal-label-row">
      <label class="jc-modal-label" for="apply-cover-letter" jhiTranslate="jobCopilot.applyModal.coverLetter">Lettre de motivation</label>
      <div class="jc-modal-label-actions">
        <select
          (ngModelChange)="language.set($event)"
          [ngModel]="language()"
          [aria-label]="'jobCopilot.applyModal.languages.ariaLabel' | translate"
          class="jc-modal-lang-select"
        >
          @for (lang of languages; track lang.value) {
            <option [value]="lang.value">{{ lang.labelKey | translate }}</option>
          }
        </select>
        <button (click)="regenerateCoverLetter()" [disabled]="regenerating()" class="jc-btn jc-btn-ghost jc-btn-sm" type="button">
          @if (regenerating()) {
            <fa-icon [animation]="'spin'" icon="circle-notch"></fa-icon>
          } @else {
            <fa-icon icon="sync"></fa-icon>
          }
          <span jhiTranslate="jobCopilot.applyModal.regenerate">Régénérer</span>
        </button>
        <button (click)="togglePreview()" class="jc-btn jc-btn-ghost jc-btn-sm" type="button">
          @if (previewMode()) {
            <fa-icon icon="pencil-alt"></fa-icon> <span jhiTranslate="jobCopilot.applyModal.edit">Modifier</span>
          } @else {
            <fa-icon icon="eye"></fa-icon> <span jhiTranslate="jobCopilot.applyModal.preview">Aperçu</span>
          }
        </button>
      </div>
    </div>
    @if (previewMode()) {
      <div [innerHTML]="coverLetterHtml()" class="jc-modal-preview"></div>
    } @else {
      <textarea
        (ngModelChange)="coverLetter.set($event)"
        [ngModel]="coverLetter()"
        class="jc-modal-textarea"
        id="apply-cover-letter"
        rows="14"
      ></textarea>
    }
  </div>
}
<button (click)="copyToClipboard()" class="jc-btn jc-btn-ghost" type="button">
  <fa-icon [icon]="copied() ? 'check' : 'copy'"></fa-icon>
  {{ (copied() ? 'jobCopilot.applyModal.copied' : 'jobCopilot.applyModal.copy') | translate }}
</button>
@if (error()) {
  <div class="jc-error"><fa-icon icon="circle-exclamation"></fa-icon> {{ error() }}</div>
}
