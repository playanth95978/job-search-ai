@if (descriptionHtml(); as desc) {
  <div class="jc-card">
    <h3 class="jc-card-header"><fa-icon icon="file-alt"></fa-icon> <span jhiTranslate="jobCopilot.applyModal.tabs.offer">Offre</span></h3>
    <div [innerHTML]="desc" class="jc-offer-description-body"></div>
  </div>
} @else if (enriching()) {
  <div class="jc-card jc-modal-loading">
    <fa-icon [animation]="'spin'" icon="circle-notch"></fa-icon>
    <span jhiTranslate="jobCopilot.applyModal.loadingDescription">Chargement de la description…</span>
  </div>
} @else {
  <p class="jc-modal-empty" jhiTranslate="jobCopilot.applyModal.noDescription">Aucune description disponible.</p>
}
