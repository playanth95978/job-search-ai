<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1 data-cy="loginTitle" jhiTranslate="login.title">Authentification</h1>
      <p class="mb-0 opacity-75">Bienvenue, veuillez vous connecter</p>
    </div>

    <div class="login-body">
      @if (authenticationError()) {
        <div class="alert alert-danger auth-error shadow-sm" data-cy="loginError" role="alert">
          <div class="d-flex align-items-center">
            <span jhiTranslate="login.messages.error.authentication">
              <strong>Erreur d&apos;authentification !</strong> Veuillez vérifier vos identifiants de connexion.
            </span>
          </div>
        </div>
      }

      <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="form-floating mb-3">
          <input
            type="text"
            #username
            name="username"
            id="username"
            placeholder="{{ 'global.form.username.placeholder' | translate }}"
            formControlName="username"
            data-cy="username"
            class="form-control shadow-sm"
          />
          <label for="username" jhiTranslate="global.form.username.label">Nom d&apos;utilisateur</label>
        </div>

        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control shadow-sm"
            name="password"
            id="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
            data-cy="password"
          />
          <label for="password" jhiTranslate="login.form.password">Mot de passe</label>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 px-1">
          <div class="form-check">
            <input class="form-check-input" formControlName="rememberMe" id="rememberMe" name="rememberMe" type="checkbox" />
            <label class="form-check-label" for="rememberMe" jhiTranslate="login.form.rememberme"> Garder la session ouverte </label>
          </div>
          <a
            class="small text-decoration-none"
            data-cy="forgetYourPasswordSelector"
            jhiTranslate="login.password.forgot"
            routerLink="/account/reset/request"
          >
            Oublié ?
          </a>
        </div>

        <button [disabled]="loginForm.invalid" class="btn btn-primary w-100 login-btn shadow-sm" data-cy="submit" type="submit">
          <span jhiTranslate="login.form.button">Connexion</span>
        </button>

        <div class="google-auth-section mt-3">
          <button
            (click)="loginWithGoogle()"
            type="button"
            class="btn btn-outline-dark w-100 shadow-sm d-flex align-items-center justify-content-center"
          >
            <img src="content/images/google-logo.svg" alt="Google Logo" class="me-2" style="width: 20px; height: 20px" />
            <span>Se connecter avec Google</span>
          </button>
        </div>

        <!--        <div class="divider d-flex align-items-center my-4">-->
        <!--          <p class="text-center fw-bold mx-3 mb-0 text-muted">OU</p>-->
        <!--        </div>-->
      </form>

      <!--      <div class="login-footer">-->
      <!--        <div class="links-section">-->
      <!--          <span jhiTranslate="global.messages.info.register.noaccount">Vous n&apos;avez pas encore de compte ?</span>-->
      <!--          <br />-->
      <!--          <a class="fw-bold" jhiTranslate="global.messages.info.register.link" routerLink="/account/register"> Créer un compte </a>-->
      <!--        </div>-->
      <!--      </div>-->
    </div>
  </div>
</div>
