<div class="chat-header">
  <div class="header-info">
    <fa-icon [icon]="['fas', 'robot']" class="ai-icon"></fa-icon>
    <div class="title-wrapper">
      <h1 jhiTranslate="chat.header.title">Assistant IA</h1>
      <span class="status-badge" jhiTranslate="chat.header.status">En ligne</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="header-btn primary-btn" (click)="newChatClicked.emit()" [title]="'chat.header.newChat' | translate">
      <fa-icon [icon]="'plus'"></fa-icon>
      <span jhiTranslate="chat.header.newChatShort">Nouveau</span>
    </button>
  </div>
</div>
