<div class="chat-page">
  <aside class="chat-sidebar">
    <jhi-chat-history />
  </aside>
  <jhi-chat-container-wrapper>
    <jhi-chat-header (exportClicked)="exportConversation()" (historyClicked)="toggleHistory()" (newChatClicked)="startNewChat()" />

    <jhi-chat-messages
      [hasRag]="true"
      [formatMessage]="formatMessage"
      [isTyping]="isTyping()"
      [messages]="messages()"
      [streamingHtml]="streamingHtml()"
      [streamingMessage]="streamingMessage()"
      (feedbackClicked)="onFeedback($event)"
    />

    <!-- Follow-up suggestions -->
    @if (suggestions().length > 0 && !isTyping()) {
      <div class="suggestions-bar">
        @for (suggestion of suggestions(); track suggestion) {
          <button class="suggestion-chip" (click)="onSuggestionClick(suggestion)">
            <fa-icon [icon]="'lightbulb'"></fa-icon>
            {{ suggestion | translate }}
          </button>
        }
      </div>
    }
    <jhi-chat-input-area
      (loginClicked)="login()"
      (sendClicked)="onSendClicked()"
      (userInputChange)="userInput = $event"
      [account]="account()"
    />

    <!-- Panneau coulissant : historique des conversations, à côté du chat -->
  </jhi-chat-container-wrapper>
</div>
