<div class="chat-page">
  <aside class="chat-sidebar">
    <jhi-chat-history />
  </aside>
  <jhi-chat-container-wrapper>
    <jhi-chat-header (newChatClicked)="startNewChat()" />

    <jhi-chat-messages
      [hasRag]="true"
      [formatMessage]="formatMessage"
      [isTyping]="isTyping()"
      [messages]="messages()"
      [streamingHtml]="streamingHtml()"
      [streamingMessage]="streamingMessage()"
      (feedbackClicked)="onFeedback($event)"
    />

    <!-- Bulles de suggestions : amorces sur un fil vide, relances après une réponse -->
    <jhi-chat-suggestions [suggestions]="suggestions()" (suggestionSelected)="onSuggestionClick($event)" />
    <jhi-chat-input-area (loginClicked)="login()" (userInputChange)="userInput = $event" />

    <!-- Panneau coulissant : historique des conversations, à côté du chat -->
  </jhi-chat-container-wrapper>
</div>
