<div class="chat-page">
  <aside class="chat-sidebar">
    <jhi-chat-history />
  </aside>

  <section class="chat-main">
    <div #thread class="chat-thread">
      @if (messages().length === 0 && !loading()) {
        <div class="chat-welcome">
          <div class="chat-welcome-icon"><fa-icon icon="wand-magic-sparkles" size="2x" /></div>
          <h2 jhiTranslate="chat.empty.title">Démarrez une nouvelle conversation</h2>
          <p class="text-secondary" jhiTranslate="chat.empty.subtitle">
            Posez une question à votre copilote : recherche d'offres, matching, candidatures…
          </p>
          <div class="chat-suggestions">
            @for (s of suggestions; track s) {
              <button type="button" class="chat-suggestion" (click)="useSuggestion(s)">
                <span [jhiTranslate]="s">…</span>
              </button>
            }
          </div>
        </div>
      } @else {
        @for (m of messages(); track $index) {
          <div class="chat-msg" [class.is-user]="m.type === 'USER'">
            <div class="chat-avatar">
              <fa-icon [icon]="m.type === 'USER' ? 'user' : 'wand-magic-sparkles'" />
            </div>
            <div class="chat-bubble">{{ m.content }}</div>
          </div>
        }
        @if (sending()) {
          <div class="chat-msg">
            <div class="chat-avatar"><fa-icon icon="wand-magic-sparkles" /></div>
            <div class="chat-bubble chat-typing"><span></span><span></span><span></span></div>
          </div>
        }
      }
    </div>

    <form class="chat-composer" (ngSubmit)="send()">
      <textarea
        class="chat-input"
        rows="1"
        [(ngModel)]="draft"
        name="draft"
        [placeholder]="'chat.input.placeholder' | translate"
        (keydown.enter)="$event.preventDefault(); send()"
      ></textarea>
      <button type="submit" class="chat-send" [disabled]="sending() || !draft.trim()" [title]="'chat.input.send' | translate">
        <fa-icon [icon]="sending() ? 'circle-notch' : 'paper-plane'" [animation]="sending() ? 'spin' : undefined" />
      </button>
    </form>
  </section>
</div>
