<div class="chat-input-area">
  <div class="input-wrapper">
    <input #fileInput (change)="fileSelected.emit($event)" accept=".pdf" multiple style="display: none" type="file" />
    <div class="input-main">
      @if (type() === 'PDF') {
        <button
          (click)="triggerUploadClicked.emit(fileInput)"
          class="upload-trigger-btn"
          [title]="'chat.input.attachDocuments' | translate"
        >
          <fa-icon [icon]="'file-arrow-up'"></fa-icon>
        </button>
      }

      <div class="input-content">
        <!-- Entrée = envoyer, Maj+Entrée = nouvelle ligne (convention ChatGPT/Gemini).
             La saisie reste active pendant la génération : on peut préparer la question suivante. -->
        <textarea
          #promptInput
          (keydown.enter)="onEnter($event)"
          (ngModelChange)="onUserInput($event)"
          (input)="autoGrow(promptInput)"
          [ngModel]="userInput()"
          [placeholder]="'chat.input.placeholder' | translate"
          rows="1"
        ></textarea>
      </div>
      @if (isTyping()) {
        <button
          (click)="stopGeneration()"
          class="send-button stop-button"
          [title]="'chat.input.stopGeneration' | translate"
          [attr.aria-label]="'chat.input.stopGeneration' | translate"
        >
          <fa-icon [icon]="'stop'"></fa-icon>
        </button>
      } @else {
        <button (click)="sendMessage()" [disabled]="!userInput().trim() || isUploading()" class="send-button">
          @if (isUploading()) {
            <fa-icon [animation]="'spin'" [icon]="'sync'"></fa-icon>
          } @else {
            <fa-icon [icon]="['fas', 'paper-plane']"></fa-icon>
          }
        </button>
      }
    </div>
  </div>
</div>
