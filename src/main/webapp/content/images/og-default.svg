<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Job Search AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand mark -->
  <g transform="translate(100,120)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#accent)"/>
    <circle cx="42" cy="42" r="24" fill="none" stroke="#0b1220" stroke-width="10"/>
    <line x1="60" y1="60" x2="82" y2="82" stroke="#0b1220" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="100" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff">Job Search AI</text>
  <text x="102" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#94a3b8">Recherche d’emploi &amp; copilote de carrière IA</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">
    <rect x="100" y="470" width="300" height="60" rx="30" fill="#ffffff" fill-opacity="0.08"/>
    <text x="130" y="509">Matching CV ↔ offres</text>
    <rect x="420" y="470" width="270" height="60" rx="30" fill="#ffffff" fill-opacity="0.08"/>
    <text x="450" y="509">Lettres sur-mesure</text>
    <rect x="710" y="470" width="270" height="60" rx="30" fill="#ffffff" fill-opacity="0.08"/>
    <text x="740" y="509">Prépa entretien</text>
  </g>

  <text x="1100" y="560" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="url(#accent)">aicarreerfinder.com</text>
</svg>
